<title>Японія для гіда</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: one column, big tap targets. Home = six city tiles in route order, then general topics. City = list of sights. Sight = reading page with prev/next. */
:root{
  --bg:#f2f4f6; --card:#ffffff; --ink:#1c2740; --muted:#5d6980; --line:#dde2e9;
  --accent:#2c6e63; --accent-ink:#ffffff; --soft:#e4efec;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-head:'Noto Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111821; --card:#1a2330; --ink:#e7ecf3; --muted:#9aa7bb; --line:#2a3646;
  --accent:#6fc2b2; --accent-ink:#0d1a17; --soft:#1d2e2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111821; --card:#1a2330; --ink:#e7ecf3; --muted:#9aa7bb; --line:#2a3646;
  --accent:#6fc2b2; --accent-ink:#0d1a17; --soft:#1d2e2c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 0;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;min-height:52px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top a.back{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;font-weight:500;flex:none}
.crumb{color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;text-wrap:balance;margin:0}
.hero{padding:22px 0 8px}
.hero h1{font-size:28px}
.hero p{margin:8px 0 0;color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
.cities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.city{display:flex;flex-direction:column;justify-content:space-between;min-height:104px;padding:14px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);text-decoration:none}
.city .kj{font-family:var(--f-head);font-size:26px;color:var(--accent);line-height:1}
.city b{font-weight:600;font-size:16px;line-height:1.25}
.city small{color:var(--muted);font-size:13px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);text-decoration:none}
.row span.n{min-width:0}
.row i{font-style:normal;color:var(--accent);flex:none}
.page h2{font-size:26px;padding:20px 0 4px}
.page h3{font-size:19px;margin:22px 0 6px}
.page p{margin:0 0 12px}
.page ul,.page ol{padding-left:22px;margin:0 0 14px}
.page li{margin:5px 0}
.page blockquote{margin:14px 0;padding:10px 14px;border-radius:10px;background:var(--soft);border:0}
.page blockquote p{margin:0}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;min-width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:600;background:var(--soft)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.pn a{display:flex;flex-direction:column;gap:2px;min-height:56px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;min-width:0}
.pn a small{color:var(--muted);font-size:12px}
.pn a b{font-weight:500;font-size:14px;line-height:1.3}
.pn a.next{text-align:right;grid-column:2}
.pn a:only-child.prev{grid-column:1}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (min-width:560px){.cities{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<script>
var D=[{"t": "Хронологія: дати, які знадобляться", "k": "", "city": false, "intro": "<p>Ці дати повторюються в розповідях про різні місця, тому їх зручно тримати перед очима.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Рік<\/th>\n<th>Подія<\/th>\n<th>Де це зустрінемо<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>628<\/td>\n<td>За легендою, засновано Сенсо-дзі<\/td>\n<td>Токіо, Асакуса<\/td>\n<\/tr>\n<tr>\n<td>710<\/td>\n<td>Нара стає першою постійною столицею<\/td>\n<td>Нара<\/td>\n<\/tr>\n<tr>\n<td>711<\/td>\n<td>Засновано Фусімі Інарі<\/td>\n<td>Кіото<\/td>\n<\/tr>\n<tr>\n<td>752<\/td>\n<td>Освячення Великого Будди в Тодай-дзі (Нара)<\/td>\n<td>Нара<\/td>\n<\/tr>\n<tr>\n<td>794<\/td>\n<td>Столицю перенесено до Хейан-кьо (Кіото)<\/td>\n<td>Кіото<\/td>\n<\/tr>\n<tr>\n<td>1185–1192<\/td>\n<td>Перемога Мінамото, Йорітомо стає сьоґуном, початок сьоґунату Камакура<\/td>\n<td>Камакура<\/td>\n<\/tr>\n<tr>\n<td>1274 і 1281<\/td>\n<td>Монгольські вторгнення, «божественний вітер» камікадзе<\/td>\n<td>Камакура<\/td>\n<\/tr>\n<tr>\n<td>1333<\/td>\n<td>Падіння сьоґунату Камакура<\/td>\n<td>Камакура<\/td>\n<\/tr>\n<tr>\n<td>1397<\/td>\n<td>Збудовано Кінкаку-дзі, Золотий павільйон<\/td>\n<td>Кіото<\/td>\n<\/tr>\n<tr>\n<td>1467–1477<\/td>\n<td>Війна Онін, розруха в Кіото, початок епохи Сенґоку<\/td>\n<td>Кіото<\/td>\n<\/tr>\n<tr>\n<td>1583<\/td>\n<td>Хідейосі Тойотомі (полководець, об'єднувач Японії) будує замок Осака<\/td>\n<td>Осака<\/td>\n<\/tr>\n<tr>\n<td>1603<\/td>\n<td>Токуґава Ієясу (сьоґун) робить Едо центром влади<\/td>\n<td>Токіо<\/td>\n<\/tr>\n<tr>\n<td>1707<\/td>\n<td>Останнє виверження Фудзі (Хоей)<\/td>\n<td>Фудзі<\/td>\n<\/tr>\n<tr>\n<td>1868<\/td>\n<td>Реставрація Мейдзі: влада до імператора, Едо стає Токіо<\/td>\n<td>Токіо<\/td>\n<\/tr>\n<tr>\n<td>1912<\/td>\n<td>Помирає імператор Мейдзі; того ж року відкривають Шінсекай<\/td>\n<td>Токіо, Осака<\/td>\n<\/tr>\n<tr>\n<td>1923<\/td>\n<td>Великий землетрус Канто<\/td>\n<td>Токіо<\/td>\n<\/tr>\n<tr>\n<td>1945<\/td>\n<td>Бомбардування: зруйновано Токіо, Сенсо-дзі та інше<\/td>\n<td>Токіо<\/td>\n<\/tr>\n<tr>\n<td>1964<\/td>\n<td>Олімпійські ігри в Токіо<\/td>\n<td>Токіо<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "subs": []}, {"t": "Сучасна Японія: держава, політика, люди", "k": "", "city": false, "intro": "<p>Дані станом на листопад 2026 року. Політика змінюється швидко, тому перед виїздом варто ще раз глянути новини.<\/p>", "subs": [{"t": "Хто керує країною", "b": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Посада<\/th>\n<th>Хто<\/th>\n<th>Що робить<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Імператор<\/strong> (глава держави)<\/td>\n<td>Нарухіто, на троні з 1 травня 2019 (за традиційним рахунком 126-й імператор, ера Рейва)<\/td>\n<td>Символ держави й єдності народу. Політичної влади не має<\/td>\n<\/tr>\n<tr>\n<td><strong>Прем'єр-міністр<\/strong> (глава уряду)<\/td>\n<td>Санае Такаїчі, ЛДП, з 21 жовтня 2025<\/td>\n<td>Реально керує країною разом із кабінетом. Перша жінка на цій посаді<\/td>\n<\/tr>\n<tr>\n<td><strong>Парламент<\/strong><\/td>\n<td>Національний сейм із двох палат: палата представників і палата радників<\/td>\n<td>Ухвалює закони й обирає прем'єра<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Президента в Японії немає.<\/strong> Це конституційна монархія за парламентською схемою, схожа на британську.<\/p>"}, {"t": "Імператор: що він робить сьогодні", "b": "<ul>\n<li>За Конституцією 1947 року імператор є «символом держави й єдності народу». Влади в справах уряду не має навіть формально.<\/li>\n<li>Виконує лише церемоніальні «державні акти», передбачені Конституцією: призначає прем'єр-міністра (рішення ухвалює парламент, імператор лише затверджує) і голову Верховного суду, приймає іноземних гостей і послів, відкриває сесії парламенту.<\/li>\n<li>Також веде синтоїстські обряди: імператори здавна виконують роль жерця.<\/li>\n<li>Живе в Імператорському палаці в Токіо, на місці колишнього замку Едо.<\/li>\n<li>Родина: імператриця Масако, єдина дочка принцеса Айко. Спадкоємець за чинним законом: наслідний принц Фумухіто (Акісіно), брат імператора, а після нього його син принц Хісахіто. Імператорський престол займають лише чоловіки, і про зміну цього правила в Японії давно дискутують.<\/li>\n<\/ul>"}, {"t": "Прем'єр і партії", "b": "<ul>\n<li><strong>Санае Такаїчі<\/strong> очолює Ліберально-демократичну партію (ЛДП), яка керує Японією майже безперервно з 1950-х. Прем'єром вона стала у жовтні 2025 року, після Сігеру Ісіби (2024–2025) й Фуміо Кісіди (2021–2024).<\/li>\n<li>Коаліція: ЛДП і Партія інновацій Японії («Ісін»), яка базується в Осаці. Раніше ЛДП понад 20 років трималась у союзі з партією «Комейто», але цей союз розпався в жовтні 2025.<\/li>\n<li>8 лютого 2026 року Такаїчі виграла дострокові вибори: ЛДП здобула 316 місць у нижній палаті, це понад дві третини. Разом з «Ісін» коаліція має 352 місця.<\/li>\n<li>У верхній палаті коаліція більшості не має, тому закони доводиться узгоджувати з іншими партіями.<\/li>\n<li>Прем'єри змінюються часто. Після відставки Сіндзо Абе (2020) були Йосіхіде Суґа, Фуміо Кісіда, Сігеру Ісіба, а тепер Санае Такаїчі.<\/li>\n<\/ul>"}, {"t": "Скільки в Японії людей і що з цим не так", "b": "<ul>\n<li>Населення: близько 123 млн (перепис 2025 року). Японських громадян трохи менше 120 млн, і вперше з 1984 року цифра опустилась нижче цієї позначки (станом на 1 січня 2026).<\/li>\n<li>За п'ять років країна втратила понад 3 млн людей, це найбільше скорочення від початку переписів у 1920 році.<\/li>\n<li>2025 року народилось близько 706 тисяч дітей: це 10-й рік поспіль, коли цифра падає. Рівень народжуваності близько 1,1 дитини на жінку.<\/li>\n<li>Усі префектури, окрім двох, скорочуються. Токіо єдина префектура, де кількість японських громадян ще зростає, і майже третина всіх мешканців країни живе в токійській агломерації.<\/li>\n<li>Кількість іноземних мешканців рекордна і зростає в усіх префектурах.<\/li>\n<\/ul>"}, {"t": "Чим живе країна", "b": "<ul>\n<li>Четверта за розміром економіка світу.<\/li>\n<li>Центр економіки: Токіо та його агломерація (близько 36% ВВП), далі Осака з регіоном Кансай (близько 15% ВВП).<\/li>\n<li>Типові галузі: автомобілебудування, електроніка, машинобудування, фінанси, туризм. Деталі по кожному місту дивіться у блоках «Сьогодні» в розділах про міста.<\/li>\n<\/ul>"}, {"t": "Якщо спитають про сучасну Японію", "b": "<ul>\n<li><em>Хто в них президент?<\/em> Президента немає: є імператор (символічний глава держави) і прем'єр-міністр (реальний керівник уряду). Зараз це Нарухіто й Санае Такаїчі.<\/li>\n<li><em>Чи правда, що імператор нічого не вирішує?<\/em> Так, у політичних справах він не має влади. Його роль церемоніальна й духовна.<\/li>\n<li><em>Чи може бути імператрицею жінка?<\/em> Нині ні: престол успадковують лише чоловіки. У роду є принцеса Айко, але вона не спадкоємиця. Тема змін до закону про престолонаслідування в Японії обговорюється, зокрема її порушує нинішня коаліція.<\/li>\n<li><em>Скільки людей живе в Японії?<\/em> Близько 123 млн, і число зменшується.<\/li>\n<li><em>Чому в Японії так мало дітей?<\/em> Старіюче суспільство, висока вартість життя й виховання дітей, робоче навантаження. Уряд оголосив проблему «національною надзвичайною ситуацією».<\/li>\n<li><em>Чи є в Японії армія?<\/em> Є Сили самооборони. Статтю 9 Конституції (відмова від війни) в країні обговорюють, але вона досі чинна.<\/li>\n<\/ul>"}]}, {"t": "Токіо", "k": "東京", "city": true, "intro": "", "subs": [{"t": "Токіо сьогодні", "b": "<ul>\n<li><strong>Населення:<\/strong> близько 14 млн у префектурі Токіо й близько 37 млн в агломерації, це найбільша міська агломерація світу. Токіо єдина префектура, де кількість японських громадян ще зростає (за даними на 1 січня 2026).<\/li>\n<li><strong>Чим заробляє:<\/strong> агломерація дає близько 36% ВВП Японії; номінальний ВВП понад 230 трлн єн (близько $1,5 трлн). Основа: інформаційні технології й зв'язок, фінанси й страхування, нерухомість, професійні послуги (консалтинг, дослідження), промисловість, охорона здоров'я, туризм. Тут штаб-квартири великих компаній, університети й державні установи.<\/li>\n<li><strong>Столиця:<\/strong> Імператорський палац, будівля парламенту і резиденція прем'єра розташовані в центральному районі Тійода.<\/li>\n<\/ul>"}, {"t": "Історія міста", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Спершу Едо, «вхід у затоку». У XV ст. рибальське село, 1457 року Ота Докан (самурайський полководець) будує замок Едо.<\/li>\n<li>1603: Токуґава Ієясу (засновник династії сьоґунів, найвищий військовий правитель країни) робить Едо центром сьоґунату. Понад 250 років миру; у XVIII ст. тут живе близько мільйона людей, це найбільше місто світу.<\/li>\n<li>1868: Реставрація Мейдзі, влада повертається до імператора, столицю переносять із Кіото. Едо стає Токіо, «Східною столицею».<\/li>\n<li>Руїни двічі: землетрус Канто 1923 року і бомбардування 1945-го. Кожного разу місто відбудовувалось, а 1964-го Олімпіада стала символом відродження.<\/li>\n<li>Сьогодні агломерація має близько 37 млн людей.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Токіо за 400 років пройшло шлях від рибальського села до одного з найбільших міст світу. Спочатку це було болотисте узбережжя, де Ота Докан поставив замок. Справжній розквіт почався, коли Токуґава Ієясу вирішив управляти країною саме звідси. Едо стало політичним центром і містом, яке росло швидше за будь-яке інше. Потім було повернення влади імператору, залізниці, школи, контакти з Європою. А ще руйнування: після землетрусу 1923 року і війни від міста лишалося дуже мало. Але щоразу Токіо ставало ще сучаснішим. Тому тут поруч стоять давні храми Асакуси й сяючі квартали Сібуї, технорайон Акіхабара і тихі святилища Мейдзі.<\/p>\n<p><strong>Що збереглося від Едо:<\/strong> замок Едо (тепер Імператорський палац), райони Асакуса й Уено, окремі храми, мости та старі вулиці.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Чому столиця в Токіо, а не в Кіото?<\/em> 1868 року імператор Мейдзі переніс центр влади до найбільшого й найперспективнішого міста країни.<\/li>\n<li><em>Чому «Токіо»?<\/em> «Східна столиця», на відміну від Кіото, «західної».<\/li>\n<li><em>Чому майже немає смітників?<\/em> Їх прибрали після теракту 1995 року, а ще японці звикли носити сміття з собою.<\/li>\n<li><em>Чому метро таке переповнене?<\/em> Місто величезне, а транспортні компанії частково приватні й конкурують, тому якість висока. Метро перевозить до 9 млн людей на день.<\/li>\n<li><em>Це справді найбільше місто світу?<\/em> За населенням агломерації, близько 37 млн, так.<\/li>\n<li><em>Скільки ресторанів?<\/em> Понад 100 тисяч, це світовий рекорд.<\/li>\n<\/ul>"}, {"t": "Мейдзі Дзінґу", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Головне синтоїстське святилище Токіо, присвячене імператору Мейдзі (1852–1912, імператор, за якого Японія модернізувалась) та імператриці Сьокен (його дружина).<\/li>\n<li>Ліс навколо: близько 100 тисяч дерев, посаджених вручну приблизно 110 років тому. Ліс повністю штучний, але виглядає прадавнім.<\/li>\n<li>Хацумоде, перший візит нового року: понад 3 млн людей, це рекорд для Японії.<\/li>\n<li>Тут проходять синтоїстські весілля.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Це символ цілої епохи, коли Японія з закритої феодальної країни стала сучасною державою. Імператор Мейдзі скасував самурайський лад, відкрив країну світові, почав індустріалізацію, реформи, залізниці й освіту. Після його смерті люди з усієї країни дарували дерева, і за кілька років виріс цей ліс, задуманий так, щоб за сто років стати природним. Задум спрацював. Ми проходимо крізь величезні дерев'яні торії, символ переходу з буденного світу в священний. Усе стримане: природне дерево, мінімум фарб, ніякої яскравості, як у буддійських храмах Кіото. Звертайте увагу на діжки саке й вина: вони подаровані святилищу. Вино присилають навіть із Франції, бо імператор Мейдзі першим з японських правителів почав пити вино як частину європеїзації.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Чому ліс виглядає таким старим?<\/em> Його спроектували так, щоб за 100 років він став справжнім природним лісом.<\/li>\n<li><em>Чи не руйнувалось святилище?<\/em> Воно зазнало руйнувань у Другу світову і було відбудоване.<\/li>\n<li><em>Чи можна побачити весілля?<\/em> Часто так: з жерцями, барабанами та урочистою процесією.<\/li>\n<li><em>Чи правда, що святилище збудовано без цвяхів?<\/em> Це є в старих нотатках <strong>(перевірити)<\/strong>: я б не розповідала, доки не підтверджено.<\/li>\n<\/ul>"}, {"t": "Алея гінкго (Ginkgo Avenue)", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Створена в епоху Мейдзі, зараз їй трохи понад 100 років.<\/li>\n<li>Висаджено 146 дерев гінкго, у симетрії на європейський лад.<\/li>\n<li>Пік золота: приблизно з середини листопада до початку грудня, це якраз наш час.<\/li>\n<li>Гінкго є символом Токіо; це «живе викопне», дерево з історією в сотні мільйонів років.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Це одне з найкрасивіших осінніх місць Токіо. Алею створили як частину великого проєкту перетворення Едо на сучасну столицю: інженери висадили 146 гінкго, щоб вийшла ідеальна симетрія. Щоосені листя стає яскраво-жовтим, і вся алея перетворюється на довгий золотий коридор, особливо в сонячний день, коли світло просвічує крони. Під час фестивалю Ітьо Мацурі вздовж алеї стоять ярмаркові намети. Місце дуже популярне, але зберігає спокійну атмосферу. Це добра ілюстрація до японської сезонності: помічати, як змінюється природа, і радіти простим моментам.<\/p>"}, {"t": "Сібуя", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Район молоді, моди й музики; назва від самурайського роду Сібуя (XII ст.). Активно росте з 1885 року, відколи тут відкрили станцію.<\/li>\n<li>Shibuya Crossing: найзавантаженіший пішохідний перехід світу. За один зелений сигнал переходить 2–3 тисячі людей.<\/li>\n<li>Shibuya Sky і Scramble Square, одна з головних оглядових точок міста.<\/li>\n<li>Хатіко: найпопулярніше місце зустрічей у Сібуї.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Колись це було тихе село на пагорбах. Нині Сібуя живе швидким ритмом: нові бренди, виставки, вуличний стиль. Перехід виглядає хаотично, але працює ідеально: ніхто не стикається, усе рухається організовано, це токійський порядок у дії. Його знімали в «Загубленому в перекладі», «Форсажі: Токійський дрейф» та багатьох інших фільмах. Найкращі кадри: зі Starbucks навпроти, з Shibuya Sky або з переходу під кутом.<\/p>\n<p><strong>Хатіко<\/strong><\/p>\n<p>Акіта-іну, народився 1923 року. Щодня проводжав господаря-професора на станцію й зустрічав увечері. Коли господар раптово помер, пес приходив на станцію ще майже 10 років, аж до своєї смерті 1935-го. 1934 року тут поставили статую; під час війни її переплавили, а 1948-го відновили. День Хатіко відзначають 8 квітня. Це реальна історія, добре задокументована.<\/p>"}, {"t": "Асакуса і Сенсо-дзі", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Один із найстаріших районів Токіо, «старий Токіо», центр міського життя часів Едо.<\/li>\n<li>Сенсо-дзі: найстаріший храм міста, буддизм (школа Тендай), засновано 628 року. Присвячений богині милосердя Каннон.<\/li>\n<li>Камінарімон, «Ворота Грому», з гігантським червоним ліхтарем близько 700 кг.<\/li>\n<li>Накамісе: торговельна вулиця близько 250 м, їй понад 300 років, магазини переходять у сім'ях із покоління в покоління.<\/li>\n<li>1945: комплекс майже повністю знищили бомбардування. Нинішні споруди відбудовані в 1950-х, храм став символом відродження Токіо. Щороку приймає близько 30 млн відвідувачів.<\/li>\n<li>Брама Хозомон і п'ятиярусна пагода: далі за Камінарімоном стоїть Хозомон, а поруч п'ятиярусна пагода. П'ять ярусів = п'ять стихій (земля, вода, вогонь, вітер, порожнеча).<\/li>\n<li>Біля головного залу люди підносять руки до диму з великої курильниці: кажуть, що він приносить здоров'я й удачу.<\/li>\n<li>Погані передбачення омікудзі прив'язують до металевої стійки, щоб «залишити невдачу в храмі».<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>По легенді, два рибалки виловили в річці Сумідаґава невелику статую богині Каннон. Місцевий староста зрозумів, що знахідка священна, і збудував тут маленьку каплицю, яка з часом перетворилась на величезний комплекс. Статую вважають настільки святою, що її не показують публіці вже понад тисячу років: вона схована в головній залі. Навколо храму виросли лавки, театри й майстерні, а в XVII–XVIII століттях тут було так само гамірно, як зараз, лише замість туристів ходили самураї, городяни в кімоно та торговці. Біля храму люди підходять до курильниці з димом «очиститися», тягнуть омікудзі та купують омаморі.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Чому найстарший храм такий «новий»?<\/em> Оригінальні будівлі знищені війною; сучасний комплекс є точним післявоєнним відновленням.<\/li>\n<li><em>Чому нікому не показують статую?<\/em> Так велить духовна традиція.<\/li>\n<li><em>Що купити на Накамісе?<\/em> Традиційні солодощі, сувеніри, кімоно, віяла, маски, амулети.<\/li>\n<li><em>Звідки рікші?<\/em> Асакуса зберігає атмосферу Едо, рікші є частиною цього стилю.<\/li>\n<li><em>Чи можна фотографувати всередині?<\/em> Зазвичай так, але без спалаху, подекуди є обмеження.<\/li>\n<\/ul>"}, {"t": "Сіндзюку", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Хмарочоси й найбільший у світі вокзал: щодня через станцію проходить понад 3,5 млн людей.<\/li>\n<li>Історично станція на старій дорозі Едо; після війни став діловим центром.<\/li>\n<li>Кабукі-тьо: квартал розваг. Назва з 1940-х, коли тут планували театр кабукі; проєкт не здійснили, а назва лишилась.<\/li>\n<li>Омоїде Йокотьо, «Провулок спогадів»: післявоєнний ринок, крихітні бари на 6–8 місць, якітори.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Сіндзюку показує кілька епох за один вечір. Офісні башти, гігантські екрани, нескінченний потік людей. А поруч Кабукі-тьо, «місто, що ніколи не спить»: бари, клуби, караоке, неон, японський Лас-Вегас у мініатюрі, і при цьому безпечний, бо порядок тут теж тримається. Омоїде Йокотьо виник у 1940–50-х як хаотичний повоєнний ринок із дерев'яних халуп без ліцензій, звідти пішла культура маленьких японських барів. Тепер це місце, де час ніби зупинився 70 років тому.<\/p>"}, {"t": "Акіхабара", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>«Electric Town», район електроніки, аніме, манґи й ігор; його називають Акіба.<\/li>\n<li>Назва від святилища Акіба, божества вогню: після великої пожежі XIX ст. тут побудували храм для захисту кварталу.<\/li>\n<li>Станція відкрилась 1890 року, потім район став вузлом поставок овочів і фруктів.<\/li>\n<li>Після війни: крамнички з радіодеталями. 1970–80-ті: комп'ютери й гри. 1990-ті: культура отаку, аніме-мерч, мейд-кафе.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Сьогодні Акіхабара асоціюється з неоном і аніме, але все починалось із післявоєнних лавок, де продавали радіодетали й паяли власні прилади. Потім з'явились перші комп'ютерні магазини, відеоігри, а в 1990-х район став центром поп-культури. Тут можна купити все: від нових гаджетів до рідкісних ретро-приставок і фігурок. На будівлях висять банери аніме-героїв на 5–10 поверхів.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Хто такі отаку?<\/em> Люди, глибоко захоплені аніме, манґою чи іграми. Слово не обов'язково негативне.<\/li>\n<li><em>Що таке мейд-кафе?<\/em> Кафе, де офіціантки одягнені як милі покоївки. Це частина місцевої субкультури, не пов'язана з еротикою.<\/li>\n<li><em>Що купити?<\/em> Гаджети, відеоігри, старі приставки, аніме-мерч, фігурки, моделі роботів.<\/li>\n<\/ul>"}]}, {"t": "Камакура", "k": "鎌倉", "city": true, "intro": "", "subs": [{"t": "Камакура сьогодні", "b": "<ul>\n<li><strong>Населення:<\/strong> близько 173 тисяч (2020), місто приблизно за 50 км від Токіо.<\/li>\n<li><strong>Чим заробляє:<\/strong> туризм (храми, Великий Будда, пляж, торгова вулиця Комачі-дорі), дрібна торгівля й ремесла. Значна частина мешканців щодня їздить на роботу до Токіо та Йокогами, тому Камакура ще й спальний район. Відома рисовими крекерами сенбей, які смажать і продають свіжими.<\/li>\n<\/ul>"}, {"t": "Камакура: народження самурайської Японії", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>1180–1185: війна Ґемпей між кланами Мінамото й Тайра. Перемагає Мінамото-но Йорітомо (самурайський полководець, майбутній перший сьоґун).<\/li>\n<li>1192: Йорітомо отримує титул сьоґуна й засновує перший військовий уряд, сьоґунат Камакура. Імператор лишається духовною фігурою, реальна влада переходить до самураїв.<\/li>\n<li>Камакура обрана як природна фортеця між горами й морем, далеко від придворних інтриг Кіото.<\/li>\n<li>Тут розвивається дзен-буддизм, що пасував самураям: дисципліна, самовладання, прийняття смерті. Закладаються основи майбутнього бусідо.<\/li>\n<li>1274 і 1281: монгольські вторгнення; тайфуни, названі «камікадзе» («божественний вітер»), знищили флот загарбників. Країна виснажилась, сьоґунат ослаб.<\/li>\n<li>1333: падіння сьоґунату. Далі йде майже 250 років воєн: епоха двох дворів, сьоґунат Асікаґа, епоха Сенґоку; 1600-го країну об'єднає Токуґава.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Камакура не просто тихе приморське місто: тут народилась самурайська Японія. До кінця XII століття країною тисячоліттями керував двір у Кіото: імператор вважався живим божеством, а влада лежала в руках витончених, далеких від війни аристократів. Паралельно в провінції ріс новий прошарок, самураї, професійні воїни. Два найбільші роди, Мінамото й Тайра, зійшлися у війні Ґемпей, і Мінамото-но Йорітомо вийшов переможцем. Він обрав не Кіото, а Камакуру, бо це природна фортеця, яку легко захищати. Це був символічний розрив: нова влада тримається на силі меча, а не на придворних титулах. Але спокою не було. Два монгольські вторгнення виснажили країну, воїни не отримали винагород, клан Ходзьо (регенти при сьоґунах), який фактично керував, втратив підтримку. 1333 року сьоґунат упав. Спроба імператора Ґо-Дайґо повернути пряме правління тривала лише три роки. Так Камакура стала початком самурайської влади, а її падіння початком довгого ланцюга війн.<\/p>\n<p><strong>Після падіння (короткий план)<\/strong><\/p>\n<ol>\n<li>1333–1336: реставрація Кемму, імператор намагається правити сам<\/li>\n<li>1336–1392: епоха двох імператорських дворів<\/li>\n<li>1338–1573: сьоґунат Асікаґа (Муроматі)<\/li>\n<li>1467–1600: епоха Сенґоку, «війна всіх проти всіх»<\/li>\n<li>1600–1603: Токуґава об'єднує країну<\/li>\n<\/ol>\n<p><strong>Цікаво:<\/strong> Камакура була столицею лише близько 140 років, але визначила Японію на сім століть.<\/p>"}, {"t": "Дзенірай Бентен (Zeniarai Benten)", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Храм «грошової води» у скелях, ховається в печері-тунелі.<\/li>\n<li>Засновано 1185 року: сьоґун Йорітомо побачив уві сні богиню Бентен, яка веліла знайти джерело серед скель і побудувати храм.<\/li>\n<li>Традиція: помити гроші в священному джерелі, і тоді вони «приносять гроші».<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Богиня сказала, що ця вода принесе людям мир і процвітання. З тих пір тут миють монети й банкноти. Хто заради удачі, хто просто з поваги до традиції. Це місце «чистої японської магії»: тихе, сховане в горах, воно показує, як тонко японці поєднують природу, духовність і повсякденність. Покрокову інструкцію ритуалу дивіться в розділі про ритуали.<\/p>"}, {"t": "Котоку-ін: Великий Будда Камакури", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Збудований близько 1252 року. Висота 13,35 м, вага понад 120 тонн, відлитий із бронзи.<\/li>\n<li>Спершу стояв усередині величезного дерев'яного храму; у XIV–XV століттях храм зруйнували цунамі й тайфуни. З того часу Будда стоїть просто неба.<\/li>\n<li>Статуя зібрана з окремих бронзових сегментів, а всередину можна зайти й побачити, як майстри збирали фігуру.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Перед нами один з найвідоміших символів Японії. Будда пережив усе, а храм, який його оточував, зник. Тому він і став таким, яким ми його знаємо: під відкритим небом. Він втілює спокій і незворушність, і саме ці якості відчуваються тут сильніше за все.<\/p>"}, {"t": "Хасе-дера", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Один із найгарніших храмів Камакури, відомий статуєю 11-ликої богині Каннон.<\/li>\n<li>За легендою, статую вирізьблено з того самого дерева, що й її «сестру» в Хасе-дера в Нарі. Встановлена в VIII столітті.<\/li>\n<li>З тераси відкривається панорама на океан і місто.<\/li>\n<li>Бамбукові алеї, печери Бентен і безліч статуеток дзідзо, захисників дітей і мандрівників.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Хасе-дера показує японську буддійську архітектуру такою, якою вона була століттями: багато зелені, води, терас і гармонії.<\/p>"}]}, {"t": "Кавагутіко та Фудзі", "k": "富士", "city": true, "intro": "", "subs": [{"t": "Кавагутіко сьогодні", "b": "<ul>\n<li><strong>Населення:<\/strong> містечко Фудзікавагутіко має близько 26 тисяч мешканців (перепис 2020: 26 082).<\/li>\n<li><strong>Чим заробляє:<\/strong> туризмом. Озеро Кавагутіко, онсени, готелі, музеї. Усі пори року мають свій сезон: навесні сакура, влітку піші підйоми й феєрверки, восени листя, взимку сніг. До масового туризму тут жили традиційними ремеслами.<\/li>\n<li><strong>Перевантаження:<\/strong> потік туристів створив проблеми. За повідомленнями 2024 року містечко ставило бар'єр, що закрив вид на Фудзі біля популярного фотомісця. Тому варто поводитись тихо й не заходити на приватні території.<\/li>\n<\/ul>"}, {"t": "Гора Фудзі", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Висота 3776 м, найвища точка Японії. Стратовулкан віком близько 100 тисяч років, що виріс із трьох давніших вулканів.<\/li>\n<li>Останнє виверження: 1707 року (Хоей), попіл укрив Едо. Вулкан активний, але «спить»; його постійно моніторять.<\/li>\n<li>Усесвітня спадщина ЮНЕСКО з 2013 року.<\/li>\n<li>Для японців це духовна вісь світу, священна гора і синтоїстів, і буддистів.<\/li>\n<li>Сезон сходжень: липень–вересень. Наприкінці листопада вершина закрита, а найкраща видимість зазвичай з грудня по лютий.<\/li>\n<\/ul>\n<p><strong>Легенди<\/strong><\/p>\n<ul>\n<li>Гора з'явилась за одну ніч: на місці провалу утворилось озеро Біва, а викинута земля стала Фудзі.<\/li>\n<li>На вершині живе богиня Коноханасакуя-хіме, покровителька жінок, сімей і домашнього вогнища. На вершині є її святилище.<\/li>\n<li>Давні перекази кажуть, що на Фудзі жили безсмертні відлюдники-сенніни, а вершина є входом у потойбічний світ.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Гора століттями надихала ченців, поетів, митців і воїнів. З VIII століття тут жили аскети, самураї приходили до підніжжя перед боєм «підсилити дух». За епохи Едо сходження стало масовим: з'явились общини Фудзі-ко, де люди роками збирали гроші всім селом, щоб хоча б раз у житті піднятись на священну вершину. Навіть в Едо будували «міні-Фудзі», штучні пагорби, щоб ті, хто не може піти, могли замінити паломництво. Жінкам підйом заборонявся до 1872 року, бо гору вважали занадто «чистою». Сходження було ритуалом: паломники очищались у річці, вдягали біле й ішли мовчки, настроюючись на «смерть старого я» й народження нового.<\/p>\n<p><strong>Японське прислів'я:<\/strong> «Дурень, хто жодного разу не піднявся на Фудзі, але дурень і той, хто піднявся двічі». Один раз це духовний обов'язок і очищення, двічі вже зайве мордування.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Чому гора така симетрична?<\/em> Через багатошарову вулканічну будову: кілька вулканів виросли один на одному.<\/li>\n<li><em>Чому Фудзі часто здається ближчою, ніж є?<\/em> Оптична ілюзія через ідеальну форму й розмір. Насправді до неї десятки кілометрів.<\/li>\n<li><em>Чи небезпечна вона для Токіо?<\/em> Потенційно так, адже 1707 року виверження вкрило попелом Едо. Тому ведеться постійний моніторинг.<\/li>\n<li><em>Чи можна побачити Фудзі щодня?<\/em> Ні, більшу частину року вона в хмарах.<\/li>\n<li><em>Правда, що на вершині є пошта?<\/em> Так, можна надіслати листівку «з хмар».<\/li>\n<\/ul>"}, {"t": "Пагода Чурейто", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Меморіальна пагода у Фудзійосіді, збудована 1963 року на згадку про жителів міста, які загинули у війнах від Реставрації Мейдзі до кінця Другої світової. Це не стародавній храм.<\/li>\n<li>Червоний колір: захист від злих духів, життя й пам'ять.<\/li>\n<li>До пагоди ведуть 398 сходинок, їх називають «сходами роздумів».<\/li>\n<li>Знаменитий кадр «червона пагода + сакура + Фудзі» став символом Японії лише з 1980–90-х років, коли розвинулась фотографія.<\/li>\n<\/ul>\n<p><strong>Що таке пагода<\/strong><\/p>\n<p>Пагода прийшла в Японію з Китаю й Індії разом із буддизмом. Спочатку це були ступи, місця зберігання реліквій Будди. П'ять ярусів відповідають п'яти елементам: земля, вода, вогонь, вітер і порожнеча. Пагоди ставили поруч із храмами як «міст» між світом живих, світом предків і світом духів.<\/p>\n<p><strong>Історія<\/strong><\/p>\n<p>Пагода дивиться на місто згори, ніби охороняє тих, кого пом'ятає. Задумувалась вона не як туристична пам'ятка, і це допомагає розповісти про неї без «відкритковості»: мирна пам'ять, традиційна форма, а над усім гора. Підйом на 398 сходинок схожий на маленьке очищення, як колись у паломників.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Це храм?<\/em> Ні, це меморіальна пагода у військово-пам'ятному комплексі.<\/li>\n<li><em>Чому її вважають символом Японії?<\/em> Вона об'єднує три головні символи: пагоду, сезонну природу і гору Фудзі.<\/li>\n<\/ul>"}]}, {"t": "Кіото", "k": "京都", "city": true, "intro": "", "subs": [{"t": "Кіото сьогодні", "b": "<ul>\n<li><strong>Населення:<\/strong> близько 1,46 млн, зокрема близько 150 тисяч студентів. Кіото університетське місто.<\/li>\n<li><strong>Туристи:<\/strong> близько 56 млн відвідувачів у 2024 році, з них майже 11 млн іноземців; туристичні витрати близько 1,9 трлн єн.<\/li>\n<li><strong>Чим заробляє:<\/strong> туризмом, традиційними ремеслами (шовк і фарбування кімоно, кераміка, саке з району Фусімі) і високими технологіями. Тут розташовані Nintendo (заснована 1889 року як виробник карт), Kyocera, Murata, Omron, Nidec, Wacoal. Про Кіото кажуть, що тут традиція й сучасність працюють одна на одну.<\/li>\n<\/ul>"}, {"t": "Історія міста", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>794 рік: імператор Камму переносить столицю з Нари до Хейан-кьо, «міста миру й гармонії». Мета: позбутись надмірного впливу буддійських монастирів на політику.<\/li>\n<li>Планування за китайським зразком (столиця Чан'ань): прямі вулиці й квартали.<\/li>\n<li>Епоха Хейан (794–1185): придворна культура, письмо кана, поезія, «Повість про Ґендзі». Тут формується японська естетика.<\/li>\n<li>Майже 1100 років Кіото лишалось імператорською столицею. Навіть коли влада була в Камакурі, Муроматі й Едо, воно залишалось центром культури, духовності й мистецтва.<\/li>\n<li>Війна Онін (1467–1477) знищила половину міста й привела країну до епохи міжусобиць, а в наступні століття з'явились Кінкаку-дзі, Гінкаку-дзі, Рьоан-дзі, Нанзен-дзі.<\/li>\n<li>1868: столицю перенесено до Токіо, Кіото стає культурною столицею.<\/li>\n<li>У Другу світову місто уникнуло бомбардувань: його внесли до списку цілей, але американське командування виключило через культурне значення. Тому Кіото одне з найкраще збережених історичних міст Японії.<\/li>\n<li>Близько 2000 храмів і святилищ, 17 об'єктів ЮНЕСКО. Міста-побратими: Київ, Флоренція, Париж.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Кіото називають «містом тисячі храмів», «колискою японської цивілізації» і «духовним центром нації». Тут жили імператори, придворні дами, поети, майстри чайної церемонії, художники й архітектори. Тут зародились чайна церемонія, ікебана, театр Но, естетика ваби-сабі, краса простоти. Сьогодні це унікальний зв'язок минулого й сучасності: серед хмарочосів ховаються давні храми, тихі вулички епохи Едо, дерев'яні будинки й райони, де ще можна побачити справжніх гейш. Кіото називають «містом, що поглинуло час».<\/p>"}, {"t": "Арасіяма", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Район на заході Кіото, біля підніжжя гір. Назва означає «буремні гори».<\/li>\n<li>Ще за епохи Хейан придворні приїздили сюди милуватись сакурою навесні й червоним кленом восени.<\/li>\n<li>Головне: бамбуковий гай, міст Тогецукьо, храм Тенрю-дзі, гора Ійватаяма з макаками, річка Ходзу з прогулянками на човнах.<\/li>\n<li>Осінь: один із головних моментів моміджі (багряніння клену).<\/li>\n<li>Храми Дзьоякко-дзі та Ґіо-дзі (тихі, мохові сади); навесні в Арасіямі проходить Ханаторо (вечірня підсвітка), восени кленове момідзі. Бамбук росте до метра на добу.<\/li>\n<\/ul>\n<p><strong>Бамбуковий гай<\/strong><\/p>\n<p>Бамбук тут здіймається на десятки метрів і створює зелений тунель. Коли вітер проходить між стовбурами, виникає звукова вібрація, яку японці вважають одним із «ста звуків Японії» (є такий офіційний перелік). Бамбук символізує захист і чистоту. Він росте до метра за добу.<\/p>\n<p><strong>Практичне:<\/strong> це одне з найлюдніших місць Кіото. Тиша буває лише дуже рано вранці, приблизно до 7–8 години.<\/p>\n<p><strong>Міст Тогецукьо<\/strong><\/p>\n<p>Назва означає «міст, через який переходить місяць». За легендою, імператор Камеяма у XIII столітті помітив, як місяць ніби ковзає мостом, відбиваючись у воді, і дав йому ім'я. Перші версії моста з'явились ще за Хейану, нинішній вигляд сформувався в епоху Едо, а в XX столітті основу зміцнили, щоб міст витримував повені й потік туристів. Дизайн лишився традиційним.<\/p>\n<p><strong>Тенрю-дзі<\/strong><\/p>\n<p>Головний дзен-храм школи Рінзай, заснований у XIV столітті, у списку ЮНЕСКО. Його сад вважається одним із найкрасивіших у Японії й майже не змінювався понад 700 років.<\/p>\n<p><strong>Отаґі Нембуцу-дзі: храм сміху<\/strong><\/p>\n<p>Храм засновано в середині VIII століття за наказом імператриці Сьотоку. Через повені й тайфуни його кілька разів руйнувало, а 1922 року споруди розібрали й зібрали на нинішньому місці в Арасіямі. Тайфун 1950 року знову його пошкодив. 1955-го настоятелем став монах і скульптор Кочо Нісімура, який хотів повернути храму життя. Він вирішив залучити людей і навчати їх різьбі: приблизно з 1981 року, протягом близько десяти років, звичайні відвідувачі під його керівництвом вирізали кам'яні статуї ракан, учнів Будди, що досягли просвітлення. Так з'явилось понад 1200 фігур. Тому вони усміхаються, сміються, тримають барабан чи пляшку саке. Кажуть, що знайти статую, схожу на себе чи близьку людину, добрий знак. Тут просвітлення приходить через сміх і щирість. Мох на статуях створює враження давнини, хоча їм ще немає й п'ятдесяти років.<\/p>\n<p><strong>Якщо спитають<\/strong><\/p>\n<ul>\n<li><em>Скільки там статуй?<\/em> Понад 1200 ракан.<\/li>\n<li><em>Хто їх вирізав?<\/em> Не професіонали: звичайні люди з усієї країни, учасники проєкту відновлення.<\/li>\n<\/ul>"}, {"t": "Фусімі Інарі (Fushimi Inari Taisha)", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Головне святилище Інарі, бога рису, врожаю, торгівлі й процвітання. Засновано 711 року.<\/li>\n<li>Понад 10 000 червоних торії утворюють алеї, що ведуть на гору. Кожна ворота є пожертвою від бізнесменів, фермерів чи приватних осіб як подяка Інарі.<\/li>\n<li>Червоний колір: захист від злих духів, очищення, життєва сила.<\/li>\n<li>Лисиці (кіцуне) є посланцями Інарі. Їх кам'яні статуї стоять по всьому комплексу, у зубах вони тримають ключі від рисових комор або сувої, символи багатства й врожаю.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Рис в Японії століттями був запорукою продовольчої безпеки, процвітання сіл, багатства родини і навіть успіху торгівлі. Тому Фусімі Інарі став центром землеробського культу: сюди приходили фермери з молитвами про добрий урожай. Прогулянка алеями торії це не просто туристичний маршрут, а крок у японську міфологію. Дорогою трапляються маленькі святині, статуї й лісові стежки, і виникає відчуття медитації й гармонії.<\/p>"}, {"t": "Санджюсангендо (Sanjusangendo)", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Назва означає «33 прольоти»: за кількістю проміжків між колонами головної зали.<\/li>\n<li>1001 статуя Каннон, богині милосердя. Кожна унікальна: різне обличчя, поза, атрибути.<\/li>\n<li>Засновано 1164 року, перебудовано 1266-го після пожежі.<\/li>\n<li>Центральну статую вирізьбив майстер у похилому віці, інші 1000 зробили його учні.<\/li>\n<li>У середні віки в залі змагались лучники (змагання «Тоя»): довжина зали ідеально підходила. Для самураїв стрільба з лука була першою бойовою дисципліною.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Статуя Каннон це зображення бодхісаттви, символ милосердя й співчуття. За японською традицією вона допомагає людям позбутись страждань. Тут мистецтво, релігія й військова підготовка переплелись в одному місці. Це добра ілюстрація до того, як духовність і самурайські традиції жили поруч.<\/p>"}, {"t": "Чайна церемонія (Тядо / Садо)", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>«Шлях чаю». Не просто чаювання, а мистецтво, філософія й духовна практика.<\/li>\n<li>Виникла в XVI столітті (епоха Сенґоку). Популяризатор: Сен-но Рікю (найвідоміший майстер чайної церемонії). Його філософія: <strong>ва, кей, сей, дзяку<\/strong>: гармонія, повага, чистота, спокій.<\/li>\n<li>Пов'язана з дзен-буддизмом, її використовують як медитацію.<\/li>\n<li>Використовують матча, порошковий зелений чай.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Гість іде крізь чайний сад, очищаючись фізично й духовно, сідає в чайній кімнаті й спостерігає за кожним рухом господаря. Усе від приготування води до подачі матчі розраховане на атмосферу зосередженості, краси й поваги до гостя й природи. Кожен елемент має значення: посуд, положення чашки, чистота приміщення, ритм дій. Навіть тихе дихання учасників є частиною церемонії. Через це японці вчаться уважності та гармонії з довкіллям і цінують красу простих речей, натуральні матеріали, сезонні зміни.<\/p>"}, {"t": "Кійомідзу-дера", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Назва означає «храм чистої води» через священне джерело Отова, воду якого вважають цілющою.<\/li>\n<li>Засновано 778 року; нинішні споруди XVII століття. Стоїть на схилі гори Хіґан із панорамою Кіото.<\/li>\n<li>Дерев'яна тераса тримається на сотнях масивних колон без жодного цвяха, інженерне диво.<\/li>\n<li>Присвячений Каннон. Сюди приходять молитись про здоров'я, удачу й здійснення бажань.<\/li>\n<li>Осінь: знамените листя клену; навесні квітне сакура.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>У давнину казали: «стрибок із Кійомідзу виконує бажання» («стрибнути з тераси Кійомідзу» і зараз означає зважитись на відчайдушний крок). Це, звісно, заборонено, але легенда збереглась.<\/p>"}, {"t": "Додатково в Кіото (не в чорновому маршруті)", "b": "<p><strong>Гіон і гейші<\/strong><\/p>\n<ul>\n<li>Гіон: історичний район Кіото з вузькими вуличками, дерев'яними будинками й чайними будинками.<\/li>\n<li>Гейші це професійні артистки: музика, танець, каліграфія, чайні церемонії, мистецтво бесіди. Виникли в XVIII столітті <strong>(перевірити: у старих нотатках XVI–XVII ст.)<\/strong>.<\/li>\n<li>Майко: учениця, яка кілька років вчиться. Яскраве кімоно з довгими рукавами й пояс обі. Після навчання стає гейшею з більш стриманим кімоно.<\/li>\n<li>Сьогодні майко й гейш можна зустріти у Гіоні ввечері біля чайних будинків. Їх стало значно менше, але вони продовжують берегти традиції.<\/li>\n<li>Етикет: не переслідуйте гейш і майко заради фото, для них це робоче місце.<\/li>\n<\/ul>\n<p><strong>Ясака-дзіндзя (Yasaka Jinja)<\/strong><\/p>\n<ul>\n<li>Один із найвідоміших синтоїстських храмів Кіото, у серці Гіона. Заснований 656 року, ще до того, як Кіото став столицею.<\/li>\n<li>Присвячений Сусаноо-но Мікото (бог морів і штормів) та його дружині Кусінада-хіме.<\/li>\n<li>Центр фестивалю Гіон Мацурі, одного з найстаріших і найбільших в Японії. Проходить у липні, триває цілий місяць.<\/li>\n<\/ul>\n<p><strong>Рьоан-дзі<\/strong><\/p>\n<ul>\n<li>Один із найвідоміших дзен-храмів. Заснований у 1450-х роках, школа Рінзай, ЮНЕСКО з 1994 року.<\/li>\n<li>Сад каменів: 15 каменів на полі з гравію. Усі 15 одночасно побачити неможливо, і це символізує ідею дзен: світ не можна осягнути цілком.<\/li>\n<li>Автор саду невідомий. Приклад ваби-сабі, краси простоти й недосконалості.<\/li>\n<\/ul>\n<p><strong>Кінкаку-дзі, Золотий павільйон<\/strong><\/p>\n<ul>\n<li>Збудований 1397 року як резиденція сьоґуна Асікаґа Йосіміцу (у старих нотатках ім'я було спотворене), згодом став дзен-храмом.<\/li>\n<li>Два верхні поверхи вкриті справжнім золотим листом, ЮНЕСКО з 1994 року.<\/li>\n<li>Три поверхи три стилі: 1-й палацовий (Хейан), 2-й самурайський, 3-й дзен-храмовий китайського зразка.<\/li>\n<li>Стоїть на березі «дзеркального» ставка Кйоко-ті, де відбиття створює ефект павільйону, що «парить» над водою.<\/li>\n<li>Спалений 1950 року, відбудований 1955-го.<\/li>\n<\/ul>\n<p><strong>Криваві стелі (血天井, тітендзьо)<\/strong><\/p>\n<p>Запасний пункт, якщо буде нагода заглянути. Це не окрема пам'ятка, а історія, яку розказують у кількох храмах Кіото.<\/p>\n<ul>\n<li>Дерев'яні стелі, на яких, за переказом, лишились сліди крові й відбитки долонь та ступень загиблих самураїв.<\/li>\n<li>Дошки не виготовлені для стель: це підлога замку Фусімі (Момояма) на півдні Кіото. Після бою її підняли й вмонтували в стелі храмів, щоб ніхто не ходив по місцю трагедії, щоб душі загиблих знайшли спокій і як нагадування про ціну вірності й честі.<\/li>\n<li>Для японців це не жах, а своєрідний меморіал загиблим.<\/li>\n<\/ul>\n<p><strong>Історія.<\/strong> Влітку 1600 року, незадовго до битви при Секіґахарі (вона вирішила, хто правитиме Японією, і 1603-го привела Токуґаву Ієясу до влади), армія Ісіди Міцунарі (воєначальник, який очолив «західну армію» проти Токуґави) рушила на замок Фусімі. Замок обороняв Торій Мототада (вірний васал Токуґави Ієясу). Сили були нерівними: за різними даними, проти кількох десятків тисяч нападників лишилось близько 380 захисників. Торій Мототада мав виграти для Токуґави час, поки той збирав союзників на сході. Вони тримались близько 11 днів, а після падіння замку самураї вчинили сеппуку (ритуальне самогубство). Пізніше дошки підлоги розійшлись по храмах.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Храм<\/th>\n<th>Де<\/th>\n<th>Що відомо<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Йоґен-ін<\/strong> (Yogen-in)<\/td>\n<td>схід Кіото<\/td>\n<td>Кажуть, що тут видно обриси самого Мототади. Невеликий храм, засновано 1594 року. За моїми відомостями, поруч із Санджюсангендо, а отже може вписатись у день 26 листопада <strong>(перевірити на карті)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Генко-ан<\/strong> (Genko-an)<\/td>\n<td>північ Кіото, район Такаґаміне<\/td>\n<td>Найвідоміший: тут добре видно відбитки ступень і долонь. Також славиться круглим «вікном просвітлення»<\/td>\n<\/tr>\n<tr>\n<td><strong>Сьоден-дзі<\/strong> (Shoden-ji)<\/td>\n<td>північний захід Кіото<\/td>\n<td>Спокійний храм із сухим садом і краєвидом на гору Хієй<\/td>\n<\/tr>\n<tr>\n<td><strong>Хосен-ін<\/strong> (Hosen-in)<\/td>\n<td>Охара, гори на півночі<\/td>\n<td>Плями на стелі непомітніші, ніж в інших<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Деякі джерела називають п'ятим ще Мьошін-дзі або Кошьо-дзі в Удзі. Кількість загиблих у джерелах трохи різниться: від близько 380 до 400.<\/p>\n<p><strong>Якщо спитають:<\/strong> <em>Чи справжня це кров?<\/em> Це переказ: стару кров на дереві з'ясувати складно, тому краще говорити «за переказом, сліди крові». <em>Чому ніхто не ходить по цих дошках?<\/em> Їх підняли на стелю з пошани до загиблих.<\/p>"}]}, {"t": "Осака", "k": "大阪", "city": true, "intro": "", "subs": [{"t": "Осака сьогодні", "b": "<ul>\n<li><strong>Населення:<\/strong> близько 2,75 млн у місті (третє за розміром у Японії), близько 8,8 млн у префектурі, близько 20 млн у регіоні Кансай.<\/li>\n<li><strong>Чим заробляє:<\/strong> це друга за значенням економіка країни після Токіо. Місто дає близько 4% ВВП Японії, а Кансай близько 15%. Галузі: торгівля й великі торгові доми (Sumitomo, Itochu, Marubeni), фармацевтика (район Досьомачі називають «містом ліків»), електроніка й побутова техніка (Panasonic, Sharp), машинобудування (Kubota), харчова промисловість, фінанси, логістика, туризм (зокрема Universal Studios Japan). 2025 року тут проходила всесвітня виставка Expo.<\/li>\n<li><strong>Політика:<\/strong> Осака база партії «Ісін», яка входить до урядової коаліції.<\/li>\n<\/ul>"}, {"t": "Осака: «кухня Японії»", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Третє за розміром місто Японії. Історично торгівля, ремесла, виробництво продовольства, звідси «кухня Японії». Портове місто на узбережжі.<\/li>\n<li>На відміну від Токіо, яке було центром політичної влади, Осака жила торгівлею.<\/li>\n<li>Характер: розслаблена атмосфера, любов до їжі, ринків і розваг, жарти й веселощі. Токіо виглядає як суворий діловий центр.<\/li>\n<li>VIII століття: перші поселення; пізніше важливий торговий і культурний вузол.<\/li>\n<\/ul>"}, {"t": "Замок Осака", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Збудований 1583 року Хідейосі Тойотомі (полководець, який завершив об'єднання Японії) як центр влади, місце проживання самураїв і адміністрація міста. Символ епохи Сенґоку.<\/li>\n<li>Вісім поверхів: п'ять видно ззовні, три приховані всередині. Масивні кам'яні стіни й глибокий водяний рів робили замок майже неприступним.<\/li>\n<li>Після смерті Хідейосі замок зруйнували, кілька разів перебудовували, зокрема за Едо. 1931 року повністю реконструйований. Тепер музей зі зброєю, обладунками, документами й макетами.<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Замок будували не лише для оборони. Це була демонстрація сили й впливу, адже тут сходились контроль над торгівлею, самурайська служба й політика. Центральна вежа давала огляд усього міста й околиць. Стоячи тут, добре видно, як Осака виросла з торгового порту до одного з центрів японського бізнесу.<\/p>"}, {"t": "Куромон Ітіба та Дотонбері", "b": "<ul>\n<li><strong>Куромон Ітіба:<\/strong> ринок існує понад 190 років, це «кухня міста». Спершу центр торгівлі свіжими продуктами: м'ясо, риба, овочі, фрукти. Тепер туристи й місцеві приходять скуштувати свіжу рибу, суші, солодощі й сезонні фрукти. Тягнеться на кілька кварталів, крита галерея. Можна спостерігати, як страву готують просто на місці.<\/li>\n<li><strong>Дотонбері:<\/strong> район виник у XVII столітті навколо каналу Дотонбори-ґава, збудованого для торгівлі й перевезення товарів. З часом на берегах з'явились ресторани, театри, розважальні заклади й магазини. Нині: неонові вивіски, гігантський краб, гігантський такояки, вулиця ресторанів і барів. Класика: такояки й окономіякі. Увечері можна побачити світлове шоу на каналі.<\/li>\n<\/ul>"}, {"t": "Намба Ясака-дзіндзя (Namba Yasaka Jinja)", "b": "<ul>\n<li>Незвичайне святилище з архітектурою у вигляді гігантської голови лева (Сіші).<\/li>\n<li>Відкрита паща лева прогоняє зло, хвороби й неприємності та приваблює удачу. Сюди приходять молитись про здоров'я, безпеку родини й благополуччя в справах.<\/li>\n<li>Історія святилища сягає VII століття, коли район був торговельно-адміністративним центром регіону <strong>(перевірити)<\/strong>.<\/li>\n<\/ul>"}, {"t": "Шінсекай (Shinsekai)", "b": "<ul>\n<li>«Новий світ»: район із унікальною історією, заснований 1912 року. Задумувався як модернізований міський центр: північна частина за зразком Парижа, південна за зразком Нью-Йорка.<\/li>\n<li>Головний символ: вежа Цутенкаку, збудована 1912 року, відновлена 1956-го після руйнування в Другу світову.<\/li>\n<li>Вузькі вулички, магазини, ресторани, кабаре та ігрові зали. Тепер це ностальгія за старою Осакою й сучасна культура їжі та розваг.<\/li>\n<\/ul>"}]}, {"t": "Нара", "k": "奈良", "city": true, "intro": "", "subs": [{"t": "Нара сьогодні", "b": "<ul>\n<li><strong>Населення:<\/strong> близько 347 тисяч у місті (2025), близько 1,3 млн у префектурі.<\/li>\n<li><strong>Чим заробляє:<\/strong> туризм (близько 12 млн відвідувачів у 2023 році), традиційні ремесла (тушь і пензлі для каліграфії, чай, саке). Великої промисловості немає, багато мешканців їздять на роботу до Осаки й Кіото. ВВП міста близько 1,1 трлн єн (2021).<\/li>\n<\/ul>"}, {"t": "Нара: перша столиця", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>710–794 (епоха Нара): перша постійна столиця Японії. Імператорка Ґемме перенесла її з тимчасових палаців, щоб створити стабільний адміністративний центр, зміцнити владу й розвивати культуру.<\/li>\n<li>Планування за китайською столицею Чан'ань: прямі вулиці, квартали, палаци, храми.<\/li>\n<li>Буддизм став інструментом укріплення влади: храми виконували функції освіти, дипломатії й духовного контролю.<\/li>\n<li>Головні храми: Тодай-дзі, Кофуку-дзі (храм клану Фудзівара, наймогутнішого аристократичного роду того часу), святилище Касуґа Тайся.<\/li>\n<li>Епоха Нара стала фундаментом для епохи Хейан і розвитку Кіото.<\/li>\n<\/ul>"}, {"t": "Священні олені", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Легенда: бог Такемікадзуті прибув до Нари на білому олені, щоб указати місце для святилища Касуґа Тайся. Відтоді олені є посланцями богів, символами удачі й захисту.<\/li>\n<li>Чому їх так багато: у ранні століття їх охороняли й розводили при храмах, убивати їх було заборонено.<\/li>\n<li>Сьогодні в парку Нара близько 1200–1300 оленів, їх можна годувати спеціальним печивом сіка сенбей, дотримуючись правил.<\/li>\n<\/ul>"}, {"t": "Касуґа Тайся (Kasuga Taisha)", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Одне з найвідоміших синтоїстських святилищ Японії. Засноване 768 року кланом Фудзівара для захисту столиці й добробуту мешканців.<\/li>\n<li>Тисячі кам'яних і бронзових ліхтарів, що світяться під час фестивалів. Святилище стоїть у лісистій зоні Нари, у гармонії з природою.<\/li>\n<li>Ліхтарі символізують світло, очищення й божественну присутність. Вважається, що світло відганяє злих духів і приваблює удачу.<\/li>\n<li>Олені вільно ходять територією, нагадуючи про зв'язок людини з природою.<\/li>\n<\/ul>"}, {"t": "Тодай-дзі", "b": "<p><strong>Коротко<\/strong><\/p>\n<ul>\n<li>Один із найважливіших храмів Японії. Будівництво почалось у VIII столітті, в епоху Нара, щоб зміцнити владу імператора й поширити буддизм як державну релігію.<\/li>\n<li>Великий Будда (Дайбуцу): одна з найбільших у світі бронзових статуй Будди Вайрочани.<\/li>\n<li>Ідея гігантської статуї виникла, щоб посилити духовний захист держави й принести мир після природних катастроф та епідемій, які вважали знаком небесного гніву.<\/li>\n<li>Лиття в такому масштабі було інженерним дивом VIII століття.<\/li>\n<li>Храм був центром освіти й релігійної влади: ченці з усієї країни приїздили вчитись.<\/li>\n<li>Колона з отвором, що за розміром дорівнює ніздрі Будди: пролізти крізь неї означає символічне переродження й очищення (дивіться розділ про ритуали-активності).<\/li>\n<\/ul>\n<p><strong>Історія<\/strong><\/p>\n<p>Прогулянка територією дозволяє побачити велич архітектури, силу Будди й відчути історичне значення буддизму в Японії.<\/p>\n<p><strong>(перевірити)<\/strong> У старих нотатках стояло, що статую робив майстер Токуї віком понад 70 років. Схоже, це переплутано із Санджюсангендо, тому я цей фрагмент прибрала.<\/p>"}]}, {"t": "Святилище чи храм: як відрізнити й як поводитись", "k": "", "city": false, "intro": "<p>Це стане в пригоді на кожній зупинці: ми відвідаємо і святилища, і храми, а правила в них різні.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Святилище (синто)<\/th>\n<th>Храм (буддизм)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Вхід<\/td>\n<td>Торії, червона брама<\/td>\n<td>Брама з дахом, часто зі статуями-охоронцями<\/td>\n<\/tr>\n<tr>\n<td>Як молитись<\/td>\n<td>2 уклони, 2 плескання в долоні, 1 уклін<\/td>\n<td>Долоні складені разом, <strong>без плескання<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ознаки<\/td>\n<td>Шіменава (скручений солом'яний канат) із шіде (паперові зигзаги)<\/td>\n<td>Пахощі й статуї Будди<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Якщо бачите яскраво-червону браму, це синто-святилище, там плескають. Якщо брама з дахом і статуями, це буддійський храм, там просто складають руки без звуку.<\/p>", "subs": [{"t": "Як молитись у святилищі: крок за кроком", "b": "<ol>\n<li><strong>Проходження торії.<\/strong> Перед брамою злегка вклонитись. Проходити збоку, не по центру: центр лишають богам.<\/li>\n<li><strong>Омовіння рук (тьодзуя).<\/strong> Набрати воду й облити ліву руку. Потім праву. Налити воду в ліву долоню й прополоскати рот (ковша губами не торкатись). Ще раз облити ліву руку. На завершення тримати ківш вертикально й промити його ручку водою.<\/li>\n<li><strong>Молитва біля вівтаря.<\/strong> Кинути монетку й подзвонити в дзвін. Двічі вклонитись. Двічі плеснути в долоні. Помолитись про себе. Один уклін.<\/li>\n<\/ol>\n<p><strong>Порада для живої активності:<\/strong> показати групі всю послідовність один раз, а далі нехай кожен повторить самостійно біля тьодзуя.<\/p>"}]}, {"t": "Омаморі, омікудзі, ема та госюін", "k": "", "city": false, "intro": "<p>Три предмети, які бачать у кожному святилищі й постійно плутають. Легке правило: <strong>носити, читати, писати<\/strong> (Carry, Read, Write).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Предмет<\/th>\n<th>Що це<\/th>\n<th>Що робити<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Омаморі<\/strong> (御守)<\/td>\n<td>Маленький амулет на захист, удачу або конкретне благословення<\/td>\n<td><strong>Носити з собою.<\/strong> Мішечок не відкривати: молитва лишається всередині<\/td>\n<\/tr>\n<tr>\n<td><strong>Омікудзі<\/strong> (おみくじ)<\/td>\n<td>Паперове передбачення долі: кохання, гроші, навчання, здоров'я, подорожі, робота<\/td>\n<td><strong>Прочитати.<\/strong> Хороше можна забрати, погане прив'язати на спеціальну стійку<\/td>\n<\/tr>\n<tr>\n<td><strong>Ема<\/strong> (絵馬)<\/td>\n<td>Дерев'яна табличка для бажання, молитви чи подяки<\/td>\n<td><strong>Написати й залишити.<\/strong> Не забирати після того, як повісили<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "subs": [{"t": "Омаморі: які бувають", "b": "<p>Як носити: на сумці, на ключах, у кишені чи гаманці. Є класичні мішечки, талісмани-гаманці, брелоки й нашивки. Обирайте за тим, що вам зараз важливо.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Слово на омаморі<\/th>\n<th>Значення<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kōtsū-anzen<\/td>\n<td>безпека в дорозі<\/td>\n<\/tr>\n<tr>\n<td>Gakugyō-jōju<\/td>\n<td>успіх у навчанні<\/td>\n<\/tr>\n<tr>\n<td>En-musubi<\/td>\n<td>стосунки й зв'язки<\/td>\n<\/tr>\n<tr>\n<td>Kaiun<\/td>\n<td>удача<\/td>\n<\/tr>\n<tr>\n<td>Yaku-yoke<\/td>\n<td>захист від нещасть<\/td>\n<\/tr>\n<tr>\n<td>Shōbai-hanjō<\/td>\n<td>процвітання в бізнесі<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На самих омаморі часто пишуть ієрогліфи: 福 удача, 健康 здоров'я, 愛 любов, 学業 навчання. Допомога групі: запропонувати кожному вибрати омаморі за значенням, яке йому зараз потрібне.<\/p>"}, {"t": "Омікудзі: як користуватись", "b": "<ol>\n<li>Потрусити коробку й витягти паличку з номером.<\/li>\n<li>Знайти передбачення в шухлядці за номером.<\/li>\n<li>Прочитати. Дивіться не лише на «рейтинг», а й на поради.<\/li>\n<li>Погане передбачення прив'язати на спеціальній стійці, щоб «лишити біду позаду». Хороше можна забрати з собою.<\/li>\n<\/ol>\n<p>Перелік результатів: 大吉 велика удача, 中吉 середня, 小吉 мала, 吉 удача, 半吉 половинна, 末吉 майбутня удача, 凶 невдача, 大凶 велика невдача. Порядок і набір категорій можуть відрізнятись від місця до місця. Погане передбачення не кінець світу.<\/p>\n<p>У передбаченні часто окремо говориться про бажання, любов, подорожі, роботу, здоров'я.<\/p>"}, {"t": "Ема: як повісити", "b": "<ol>\n<li>Купити табличку й написати побажання.<\/li>\n<li>Повісити на стенд.<\/li>\n<li>Зав'язати мотузочку.<\/li>\n<\/ol>\n<p>Типові побажання: здоров'я, іспити, стосунки, успіх, безпечні подорожі, особисті цілі.<\/p>"}, {"t": "Госюін (御朱印)", "b": "<ul>\n<li>Каліграфічний штамп-автограф у храмах і святилищах: назва, дата відвідування, червоні печатки (ханко). Підтвердження, що ви були в цьому місці.<\/li>\n<li>Пишеться тушшю вручну, при вас. Навіть в одному храмі почерк трохи різниться з дня в день.<\/li>\n<li>Купується спеціальний зошит госюінтьо (御朱印帳), у храмах або в канцелярських крамницях. Один запис коштує зазвичай 300–500 єн; у популярних храмах Кіото в сезон бувають черги.<\/li>\n<li>До зошита ставляться майже як до священного предмета, тож не носіть його впритул до інших речей.<\/li>\n<\/ul>"}, {"t": "Три помилки, яких слід уникати", "b": "<ul>\n<li><strong>Відкривати мішечок омаморі.<\/strong> Вміст за традицією лишається всередині.<\/li>\n<li><strong>Забирати табличку ема після того, як повісили.<\/strong> Після підношення її зазвичай залишають у святилищі.<\/li>\n<li><strong>Прив'язувати омікудзі де завгодно.<\/strong> Лише на спеціально призначеному місці.<\/li>\n<\/ul>\n<p>Якщо сумніваєтесь, дійте за вказівками на місці.<\/p>"}]}, {"t": "Ритуали-активності для групи", "k": "", "city": false, "intro": "<p>Ці ритуали краще проходити разом: не просто розповісти, а залучити людей до дії на місці.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Де<\/th>\n<th>Ритуал<\/th>\n<th>Як<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Дзішу, Кіото<\/strong> (Jishu Shrine)<\/td>\n<td>«Камені закоханих»<\/td>\n<td>Стати біля одного каменя, заплющити очі й загадати бажання. Спробувати дійти до другого каменя із заплющеними очима. Дійшли самі: кохання складеться саме. З підказками: знадобиться допомога<\/td>\n<\/tr>\n<tr>\n<td><strong>Ясуї Компіраґу, Кіото<\/strong> (Yasui Kompiragu)<\/td>\n<td>Камінь з отвором<\/td>\n<td>Купити катасіро (паперову заготовку), написати бажання. Пролізти крізь отвір: вперед для розриву поганих зв'язків, назад для залучення удачі. Прикріпити папірець до каменя. Традиція допомагає розірвати погані зв'язки й зміцнити хороші<\/td>\n<\/tr>\n<tr>\n<td><strong>Тодай-дзі, Нара<\/strong><\/td>\n<td>«Ніздря Будди»<\/td>\n<td>Стати в чергу до колони, пролізти крізь отвір. Символ переродження й очищення<\/td>\n<\/tr>\n<tr>\n<td><strong>Дзенірай Бентен, Камакура<\/strong><\/td>\n<td>«Відмивання грошей»<\/td>\n<td>Купити свічку й пахощі, запалити біля священного джерела й помолитись. Взяти кошик, покласти гроші, які хочете «очистити». Ополіскувати ківшем із джерела. Гроші забрати, кошик повернути. Відмиті гроші краще витратити на щось корисне<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Хороша ідея: заздалегідь домовитись, хто біля якого місця пробує, щоб не збивати чергу.<\/p>", "subs": []}, {"t": "Японські слова-поняття", "k": "", "city": false, "intro": "<p>Короткі «цитати-поняття», які добре звучать посеред прогулянки. Кожне можна прив'язати до місця: ліс, світло крізь листя, осінь, коли все минає.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Слово<\/th>\n<th>Значення<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Юґен<\/strong> (幽玄)<\/td>\n<td>Глибоке, таємниче відчуття краси всесвіту, що викликає легкий трепет і філософські думки<\/td>\n<\/tr>\n<tr>\n<td><strong>Шінрін-йоку<\/strong> (森林浴)<\/td>\n<td>«Лісове купання»: відчуття гармонії від прогулянки лісом<\/td>\n<\/tr>\n<tr>\n<td><strong>Коморебі<\/strong> (木漏れ日)<\/td>\n<td>Тепле відчуття спокою від сонячного світла, що пробивається крізь листя дерев<\/td>\n<\/tr>\n<tr>\n<td><strong>Бокетто<\/strong> (ぼけっと)<\/td>\n<td>Стан, коли дивишся в одну точку чи вдалечінь, а в голові порожньо й легко<\/td>\n<\/tr>\n<tr>\n<td><strong>Моно но аваре<\/strong> (物の哀れ)<\/td>\n<td>Глибоке почуття від краси часу, що минає: споглядальний ніжний смуток від усвідомлення, що все прекрасне у світі недовговічне<\/td>\n<\/tr>\n<tr>\n<td><strong>Ікіґай<\/strong> (生きがい)<\/td>\n<td>Відчуття внутрішнього задоволення й призначення, заради якого хочеться прокидатись зранку<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Про шінрін-йоку.<\/strong> Це не стародавня традиція: термін придумало Лісове агентство Японії 1982 року, і це радше державна оздоровча кампанія. Добра деталь для розповіді. Місце «для прогулянки в тиші», яке згадувалось у дописі: бамбуковий гай Сагано (Арасіяма, Кіото). Тиша там буває тільки дуже рано вранці, приблизно до 7–8 години. Інші два місця з тієї добірки поки не надійшли.<\/p>\n<p><strong>Де це можна «застосувати»:<\/strong> коморебі в ґінкго-алеї або в лісі навколо Мейдзі Дзінґу; шінрін-йоку в Арасіямі; моно но аваре під час моміджі в Кіото.<\/p>", "subs": []}, {"t": "Мовні тонкощі", "k": "", "city": false, "intro": "", "subs": [{"t": "Прислів'я «情けは人のためならず»", "b": "<p>Вимова: <em>насаке ва хіто но таме нарадзу<\/em>.<\/p>\n<ul>\n<li>情け (насаке): співчуття, доброта, участь<\/li>\n<li>人 (хіто): людина<\/li>\n<li>ため (таме): заради, для<\/li>\n<li>ならず (нарадзу): не бути<\/li>\n<\/ul>\n<p>Якщо читати буквально, виходить «добро не для іншої людини». Це звучить дивно, і саме тому прислів'я часто розуміють хибно: як «не варто робити добро» або «доброта людині не на користь».<\/p>\n<p>Насправді сенс інший: <strong>добро не закінчується на тому, кому воно було адресоване.<\/strong> Наша участь може змінити стан людини, вплинути на її ставлення до інших, запустити ланцюжок наступних вчинків і одного дня повернутись до нас найнесподіванішим боком. Добро це не те, що ми просто віддаємо: це те, що продовжує жити далі.<\/p>\n<p>Тож ідея не в тому, що не треба робити добро, і не в тому, що треба чекати чогось навзаєм. Гарна цитата для завершення: <strong>«те, як ми ставимось до інших, формує світ, у якому потім живемо і ми самі».<\/strong><\/p>"}, {"t": "Два різні тумани: кірі й касумі", "b": "<p>Японці помітили, що осінній і весняний туман відрізняються, і мають для них два різні слова й ієрогліфи. Це один із прикладів того, наскільки тонко там сприймають сезонні явища: діапазон нюансів виходить далеко за межі 72 мікросезонів і сезонних слів у поезії.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>霧 кірі<\/strong><\/th>\n<th><strong>霞 касумі<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Пора<\/td>\n<td>Осінь<\/td>\n<td>Весна<\/td>\n<\/tr>\n<tr>\n<td>Який<\/td>\n<td>Густий, холодний, з'являється зранку чи вночі, коли повітря різко холоне<\/td>\n<td>Легкий серпанок (в українській «серпанок»), коли зимові шари снігу тануть під першим теплим сонцем і волога здіймається в повітря<\/td>\n<\/tr>\n<tr>\n<td>Настрій<\/td>\n<td>Меланхолія, смуток, самотність; стирає межі між реальністю й спогадами<\/td>\n<td>Радість, оновлення, романтика; ніжна вуаль, яку весна накидає на гори, щоб приховати або підкреслити красу квітучої сакури чи сливи<\/td>\n<\/tr>\n<tr>\n<td>Гравюра Хіросіґе<\/td>\n<td>«Ранковий туман у Місімі» (三島 朝霧)<\/td>\n<td>«Вид на Конодай і річку Тоне» (国府台と利根川)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Наприкінці листопада в нас сезон кірі: можна прямо на місці звернути увагу групи на цей туман. Для вступу до розповіді варто лишити ілюстрації Утаґави Хіросіґе (великий японський художник-гравер, майстер укійо-е).<\/p>"}]}, {"t": "Японський побут і звички", "k": "", "city": false, "intro": "<p>Філософія простору й порядку. Добре підходить як коротка розмова в дорозі.<\/p>\n<ul>\n<li><strong>Ґенкан<\/strong> (玄関). Залишай зовнішній світ за порогом. У японських домівках взуття не просто знімають: його лишають у ґенкані, спеціальній зоні біля входу. Так менше бруду, бактерій і шуму зовнішнього світу потрапляє додому. Дім починається саме тут.<\/li>\n<li><strong>Конмарі.<\/strong> Зберігай речі вертикально. Японці складають одяг так, щоб бачити все одразу. Менше безладу, менше часу на пошуки, менше бажання купувати зайве.<\/li>\n<li><strong>Туалетні капці.<\/strong> У Японії для вбиральні є окрема пара капців, які ніколи не виходять за її межі. Проста звичка, що допомагає підтримувати чистоту в усьому будинку.<\/li>\n<li><strong>Радіо тайсо<\/strong> (ラジオ体操). Три хвилини руху щоранку, лише стільки. Цю ранкову гімнастику японці практикують уже майже сто років. Це не година спорту.<\/li>\n<li><strong>Каеру мае ні мото ні модосу.<\/strong> Перед тим як вийти, поверни одну річ на місце: одна книга, одна чашка, один плед. Достатньо однієї дії, і саме так безлад не накопичується.<\/li>\n<\/ul>\n<p>Зв'язок із поїздкою: ґенкан гарно пояснює, чому в рьоканах, храмах і деяких кафе просять роззуватись.<\/p>", "subs": []}, {"t": "Практичне та додатково", "k": "", "city": false, "intro": "", "subs": [{"t": "Тонізуючі напої (аптеки й комбіні)", "b": "<p>У Японії дуже поширені маленькі тонізуючі напої-«дрінки» (栄養ドリンク) для швидкого відновлення сил. Продаються в аптеках і комбіні. Можна запропонувати спробувати як локальний лайфхак від утоми під час довгого дня екскурсій.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Напій<\/th>\n<th>Для чого<\/th>\n<th>Орієнтовна ціна<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lipovitan D Hyper<\/td>\n<td>Сильна підтримка енергії, відновлення<\/td>\n<td>¥407 (близько $2,70)<\/td>\n<\/tr>\n<tr>\n<td>in Jelly Multi Mineral<\/td>\n<td>Мінерали в зручному желе-пакеті, щоб брати з собою<\/td>\n<td>¥227 (близько $1,50)<\/td>\n<\/tr>\n<tr>\n<td>Q&amp;P Kowa α<\/td>\n<td>Щоденна втома, легкий «підйом»<\/td>\n<td>від ¥162 (близько $1,10)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"t": "Кіносакі онсен (не в маршруті 2026)", "b": "<p>Він був у старих нотатках, а цього року з маршруту прибраний. Лишаю на майбутнє.<\/p>\n<ul>\n<li>Курортне містечко в префектурі Хьоґо, збудоване навколо гарячих джерел, відкритих понад 1300 років тому. Сім громадських онсенів; традиція «паломництва по всіх джерелах» у легкій юкаті.<\/li>\n<li>З татуюваннями до онсенів зазвичай не пускають: історично татуювання пов'язували з якудзою.<\/li>\n<li>Проживання в рьоканах: футони на татамі, вечеря й сніданок у стилі кайсекі.<\/li>\n<li>Не можна шуміти, стрибати у ванну, заходити в одязі й залишати воду брудною.<\/li>\n<\/ul>"}, {"t": "Чого ще бракує в гайді", "b": "<ul>\n<li>Коясан (28 листопада) і TeamLab (26 листопада): нотаток поки немає.<\/li>\n<li>Гіон, Рьоан-дзі, Кінкаку-дзі, Асакуса, Сіндзюку, Акіхабара є, але не входять у чорновий маршрут. Їх можна швидко прибрати або залишити як запасні.<\/li>\n<li>Список покупок («що купити в Японії») і гайд мандрівника ведуться окремими файлами.<\/li>\n<\/ul>"}]}, {"t": "Хто є хто: історичні постаті", "k": "", "city": false, "intro": "<p>Швидка шпаргалка, якщо хтось у групі спитає, ким був той чи інший персонаж.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ім'я<\/th>\n<th>Ким був<\/th>\n<th>Коли<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ота Докан<\/td>\n<td>самурайський полководець, збудував замок Едо<\/td>\n<td>XV ст.<\/td>\n<\/tr>\n<tr>\n<td>Імператриця Ґемме<\/td>\n<td>імператорка, перенесла столицю до Нари<\/td>\n<td>710<\/td>\n<\/tr>\n<tr>\n<td>Імператриця Сьотоку<\/td>\n<td>імператриця, засновниця храму Отаґі Нембуцу-дзі<\/td>\n<td>VIII ст.<\/td>\n<\/tr>\n<tr>\n<td>Імператор Камму<\/td>\n<td>імператор, заснував Хейан-кьо (Кіото)<\/td>\n<td>794<\/td>\n<\/tr>\n<tr>\n<td>Мінамото-но Йорітомо<\/td>\n<td>полководець, перший сьоґун, засновник сьоґунату Камакура<\/td>\n<td>1192<\/td>\n<\/tr>\n<tr>\n<td>Ходзьо<\/td>\n<td>клан регентів при сьоґунах Камакури, які фактично керували<\/td>\n<td>XIII–XIV ст.<\/td>\n<\/tr>\n<tr>\n<td>Імператор Камеяма<\/td>\n<td>імператор, дав ім'я мосту Тогецукьо<\/td>\n<td>XIII ст.<\/td>\n<\/tr>\n<tr>\n<td>Імператор Ґо-Дайґо<\/td>\n<td>імператор, який намагався повернути владу імператорам<\/td>\n<td>1333–1336<\/td>\n<\/tr>\n<tr>\n<td>Асікаґа Йосіміцу<\/td>\n<td>сьоґун, замовник Кінкаку-дзі<\/td>\n<td>кінець XIV ст.<\/td>\n<\/tr>\n<tr>\n<td>Сен-но Рікю<\/td>\n<td>найвідоміший майстер чайної церемонії<\/td>\n<td>XVI ст.<\/td>\n<\/tr>\n<tr>\n<td>Хідейосі Тойотомі<\/td>\n<td>полководець, який завершив об'єднання країни; збудував замок Осака<\/td>\n<td>1583<\/td>\n<\/tr>\n<tr>\n<td>Токуґава Ієясу<\/td>\n<td>сьоґун, засновник династії сьоґунів Токуґава, зробив Едо центром влади<\/td>\n<td>1603<\/td>\n<\/tr>\n<tr>\n<td>Утаґава Хіросіґе<\/td>\n<td>художник-гравер, майстер укійо-е<\/td>\n<td>XIX ст.<\/td>\n<\/tr>\n<tr>\n<td>Імператор Мейдзі<\/td>\n<td>імператор, за якого почалась модернізація Японії<\/td>\n<td>1868–1912<\/td>\n<\/tr>\n<tr>\n<td>Кочо Нісімура<\/td>\n<td>монах і скульптор, ініціатор проєкту з ракан в Отаґі Нембуцу-дзі<\/td>\n<td>XX ст.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "subs": []}, {"t": "Джерела", "k": "", "city": false, "intro": "<p>Основа: ваші нотатки минулого року та нові добірки з соцмереж. Для перевірки храму Отаґі Нембуцу-дзі використано <a href=\"https://en.wikipedia.org/wiki/Otagi_Nenbutsu-ji\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a> та <a href=\"https://www.japan-experience.com/all-about-japan/kyoto/temples-shrines/otagi-nembutsuji\" target=\"_blank\" rel=\"noopener\">Japan Experience<\/a>. Решта фактів перенесена з нотаток і ще не звірялась із першоджерелами, тому біля сумнівних місць стоїть <strong>(перевірити)<\/strong>.<\/p>\n<p>Для сучасної частини (політика, населення, економіка міст) використано такі джерела, дані станом на листопад 2026 року:<\/p>\n<ul>\n<li><a href=\"https://en.wikipedia.org/wiki/Government_of_Japan\" target=\"_blank\" rel=\"noopener\">Government of Japan, Wikipedia<\/a> і <a href=\"https://en.wikipedia.org/wiki/Premiership_of_Sanae_Takaichi\" target=\"_blank\" rel=\"noopener\">Premiership of Sanae Takaichi<\/a>: прем'єр, кабінет, призначення<\/li>\n<li><a href=\"https://en.wikipedia.org/wiki/Emperor_of_Japan\" target=\"_blank\" rel=\"noopener\">Emperor of Japan, Wikipedia<\/a> і <a href=\"https://web-japan.org/kidsweb/explore/imperial/q1.html\" target=\"_blank\" rel=\"noopener\">Kids Web Japan<\/a>: роль імператора, спадкоємець<\/li>\n<li><a href=\"https://eastasiaforum.org/2026/11/10/takaichis-cabinet-reshuffle-strengthens-the-ldps-political-hand/\" target=\"_blank\" rel=\"noopener\">East Asia Forum, листопад 2026<\/a> та <a href=\"https://www.icwa.in/show_content.php?lang=1&amp;level=3&amp;ls_id=14265&amp;lid=8678\" target=\"_blank\" rel=\"noopener\">ICWA про вибори 2026<\/a>: підсумки виборів, коаліція<\/li>\n<li><a href=\"https://soranews24.com/2026/08/01/japans-foreign-resident-population-hits-record-high-as-japanese-population-hits-record-low/?noamp=mobile\" target=\"_blank\" rel=\"noopener\">Sora News 24<\/a> та <a href=\"https://sharjah24.ae/en/Articles/2026/05/29/Japans-population-declines-to-123-million-in-2025\" target=\"_blank\" rel=\"noopener\">Sharjah24 про перепис<\/a>: населення<\/li>\n<li><a href=\"https://www.jetro.go.jp/en/invest/region/data/kyoto/\" target=\"_blank\" rel=\"noopener\">JETRO: Кіото<\/a>, <a href=\"https://www.jetro.go.jp/en/invest/region/data/osaka-city/\" target=\"_blank\" rel=\"noopener\">JETRO: Осака<\/a>, <a href=\"https://www.jetro.go.jp/en/invest/region/data/nara-city/\" target=\"_blank\" rel=\"noopener\">JETRO: Нара<\/a>, <a href=\"https://investkyoto.city.kyoto.lg.jp/discover\" target=\"_blank\" rel=\"noopener\">Invest Kyoto<\/a>: економіка й туристи<\/li>\n<li><a href=\"https://www3.pref.nara.jp/eastasia_e/1456.htm\" target=\"_blank\" rel=\"noopener\">Префектура Нара<\/a>: населення й туристи Нари<\/li>\n<\/ul>", "subs": []}];
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bar(back,crumb){return '<div class="top"><a class="back" href="#'+back+'">← Назад</a><span class="crumb">'+esc(crumb)+'</span></div>'}
function pl(n){var a=n%10,b=n%100;return n+' '+((a===1&&b!==11)?'місце':(a>=2&&a<=4&&(b<12||b>14))?'місця':'місць')}
function home(){
  var c='',g='';
  D.forEach(function(s,i){
    if(s.city){c+='<a class="city" href="#s'+i+'"><span class="kj">'+esc(s.k)+'</span><span><b>'+esc(s.t)+'</b><br><small>'+pl(s.subs.length)+'</small></span></a>'}
    else{g+='<a class="row" href="#s'+i+'"><span class="n">'+esc(s.t)+'</span><i>›</i></a>'}
  });
  return '<div class="hero"><h1>Японія для гіда</h1><p>20 листопада – 1 грудня 2026. Оберіть місто, потім місце.</p></div>'+
    '<div class="label">Міста за маршрутом</div><div class="cities">'+c+'</div>'+
    '<div class="label">Для будь-якої зупинки</div><div class="rows">'+g+'</div>';
}
function sec(i){
  var s=D[i]; if(!s) return home();
  if(!s.subs.length){return bar('','')+'<div class="page"><h2>'+esc(s.t)+'</h2>'+s.intro+'</div>'}
  var r='';
  if(s.intro){r+='<a class="row" href="#s'+i+'-i"><span class="n">Огляд</span><i>›</i></a>'}
  s.subs.forEach(function(x,j){r+='<a class="row" href="#s'+i+'-'+j+'"><span class="n">'+esc(x.t)+'</span><i>›</i></a>'});
  return bar('',s.t)+'<div class="hero"><h1>'+esc(s.t)+'</h1></div><div class="label">'+(s.city?'Місця':'Розділи')+'</div><div class="rows">'+r+'</div>';
}
function sub(i,j){
  var s=D[i]; if(!s) return home();
  var items=[]; if(s.intro) items.push({id:'i',t:'Огляд',b:s.intro});
  s.subs.forEach(function(x,k){items.push({id:String(k),t:x.t,b:x.b})});
  var at=-1; items.forEach(function(x,k){if(x.id===j) at=k});
  if(at<0) return sec(i);
  var it=items[at], p=items[at-1], n=items[at+1], nav='';
  if(p) nav+='<a class="prev" href="#s'+i+'-'+p.id+'"><small>← Раніше</small><b>'+esc(p.t)+'</b></a>';
  if(n) nav+='<a class="next" href="#s'+i+'-'+n.id+'"><small>Далі →</small><b>'+esc(n.t)+'</b></a>';
  return bar('s'+i,s.t)+'<div class="page"><h2>'+esc(it.t)+'</h2>'+it.b+'</div><div class="pn">'+nav+'</div>';
}
var last=null;
function render(){
  var h=(location.hash||'').replace('#','');
  if(h===last) return; last=h;
  var html;
  try{
    var m=/^s(\d+)(?:-(i|\d+))?$/.exec(h);
    if(!m) html=home(); else if(m[2]!==undefined) html=sub(+m[1],m[2]); else html=sec(+m[1]);
  }catch(e){html=home()}
  app.innerHTML=html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
